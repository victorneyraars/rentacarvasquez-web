name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    uses: victorneyraars/baqueano-natales/.github/workflows/deploy-docker.yml@91a3f59e61ed4993adce7aec70f58eefc0c1774a
    with:
      deploy-path: /home/deploy/rentacarvasquez-web
      compose-file: docker-compose.rentacar.yml
      healthcheck-url: https://rentacarvasquez.com/
      branch: main
    secrets:
      SSH_HOST: ${{ secrets.SERVER_HOST }}
      SSH_USER: ${{ secrets.SERVER_USER }}
      SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
